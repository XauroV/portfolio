<script>
(() => {
  const frame = document.querySelector('iframe');
  const mode = new URLSearchParams(location.search).get('mode');
  if (mode === 'background') document.body.classList.add('background-mode');
  const applyMode = () => {
    if (mode !== 'background') return;
    const doc = frame.contentDocument;
    if (!doc) return;
    doc.documentElement.style.background = '#fff';
    doc.body.style.padding = '0';
    doc.body.style.background = '#fff';
    ['.canopy-control-lab__head', '.canopy-control-lab__controls', '.canopy-control-lab__status', '.canopy-control-lab__hint'].forEach((selector) => {
      const node = doc.querySelector(selector);
      if (node) node.style.display = 'none';
    });
    const root = doc.getElementById('canopy-control-lab');
    const stage = doc.querySelector('.canopy-control-lab__stage');
    const canvas = stage?.querySelector('canvas');
    if (root) root.style.height = '100vh';
    if (stage) {
      stage.style.height = '100vh';
      stage.style.minHeight = '100vh';
    }
    if (canvas) {
      canvas.style.height = '100vh';
      canvas.style.minHeight = '100vh';
    }
  };
  frame.addEventListener('load', applyMode);
  applyMode();
  addEventListener('storage', (event) => {
    if (mode === 'background' && event.key === 'camphor-canopy-studio-v3') frame.contentWindow.location.reload();
  });
})();
